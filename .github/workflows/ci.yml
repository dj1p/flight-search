name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - run: npm ci
        working-directory: mcp-server

      - run: npm test
        working-directory: mcp-server
        env:
          DUFFEL_API_KEY: test_dummy_key
          FR24_API_KEY:   test_dummy_key
          MCP_API_KEYS:   test_key_ci
          REDIS_URL:      redis://localhost:6379
          LOG_LEVEL:      silent

  build-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
        env:
          VITE_MCP_URL: https://api.example.com/v1
          VITE_MCP_KEY: build_placeholder

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build MCP server image
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-server
          push: false
          tags: flight-mcp:ci

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: flight-frontend:ci
          build-args: |
            VITE_MCP_URL=https://api.example.com/v1
            VITE_MCP_KEY=build_placeholder
