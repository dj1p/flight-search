version: '3.9'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp:
    build: ./mcp-server
    restart: unless-stopped
    environment:
      PORT:           ${PORT:-3001}
      MCP_API_KEYS:   ${MCP_API_KEYS}
      DUFFEL_API_KEY: ${DUFFEL_API_KEY}
      FR24_API_KEY:   ${FR24_API_KEY}
      REDIS_URL:      redis://redis:6379
      LOG_LEVEL:      ${LOG_LEVEL:-info}
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_MCP_URL: ${VITE_MCP_URL:-http://localhost:3001/v1}
        VITE_MCP_KEY: ${FRONTEND_MCP_KEY}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - mcp

volumes:
  redis_data:
